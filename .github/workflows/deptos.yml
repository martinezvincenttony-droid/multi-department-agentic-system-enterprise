name: deptos
on:
  push:
    paths:
      - "deptos/**"
      - ".github/workflows/deptos.yml"
  pull_request:
    paths:
      - "deptos/**"
      - ".github/workflows/deptos.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deptos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m deptos
