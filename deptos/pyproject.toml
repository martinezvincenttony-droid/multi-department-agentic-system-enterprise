[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deptos"
version = "0.1.0"
description = "Deterministic multi-department agent runtime with least-privilege tools and an evidence auditor."
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
deptos = "deptos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
